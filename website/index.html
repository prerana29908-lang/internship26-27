<!DOCTYPE html>
<html>
<head>
    <title>My Shopping Website</title>

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>My Shopping Website</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Cart</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- Products Section -->
    <section class="products">

        <div class="card">
            <img src="images/nike.jpg" alt="Nike Shoes">

            <h2>Sports Shoes</h2>

            <p>Price: ₹1999</p>

            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="images/smart.jpg" alt="SmartWatch">

            <h2>Smart Watch</h2>

            <p>Price: ₹1499</p>

            <button>Add to Cart</button>
        </div>

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 My Shopping Website</p>
    </footer>

    <!-- Connect JavaScript -->
    <script src="js/script.js"></script>

</body>
</html>
